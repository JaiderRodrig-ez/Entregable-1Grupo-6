<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entregable 1 · Grupo 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/tester.css">
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="title">
        <h1>Entregable 1</h1>
        <span class="group">Grupo 6</span>
      </div>
      <p class="sub">API REST de usuarios y mascotas</p>
      <div class="server"><span class="dot" id="api-dot"></span><span id="api-health">Comprobando servidor…</span></div>
    </div>
  </header>

  <div class="layout">
    <nav class="routes" aria-label="Endpoints">
      <div class="route-group">
        <h2>Usuarios <code>/api/users</code></h2>
        <ul>
          <li><button class="route" type="button" data-resource="users" data-op="list"><span class="method get">GET</span>Listar</button></li>
          <li><button class="route" type="button" data-resource="users" data-op="one"><span class="method get">GET</span>Obtener<code>/:id</code></button></li>
          <li><button class="route" type="button" data-resource="users" data-op="create"><span class="method post">POST</span>Crear</button></li>
          <li><button class="route" type="button" data-resource="users" data-op="update"><span class="method put">PUT</span>Actualizar<code>/:id</code></button></li>
          <li><button class="route" type="button" data-resource="users" data-op="delete"><span class="method delete">DELETE</span>Eliminar<code>/:id</code></button></li>
        </ul>
      </div>
      <div class="route-group">
        <h2>Mascotas <code>/api/pets</code></h2>
        <ul>
          <li><button class="route" type="button" data-resource="pets" data-op="list"><span class="method get">GET</span>Listar</button></li>
          <li><button class="route" type="button" data-resource="pets" data-op="one"><span class="method get">GET</span>Obtener<code>/:id</code></button></li>
          <li><button class="route" type="button" data-resource="pets" data-op="create"><span class="method post">POST</span>Crear</button></li>
          <li><button class="route" type="button" data-resource="pets" data-op="update"><span class="method put">PUT</span>Actualizar<code>/:id</code></button></li>
          <li><button class="route" type="button" data-resource="pets" data-op="delete"><span class="method delete">DELETE</span>Eliminar<code>/:id</code></button></li>
        </ul>
      </div>
      <div class="route-group">
        <h2>Otra ruta</h2>
        <ul>
          <li><button class="route" type="button" id="route-manual"><span class="method">ANY</span>Petición manual</button></li>
        </ul>
      </div>
    </nav>

    <main class="work">
      <section class="panel request" id="request" aria-label="Petición">
        <div class="request-line"><span class="method get" id="req-method">GET</span><code id="req-path">/api/users</code></div>
        <p class="request-note" id="req-note"></p>

        <form id="request-form">
          <div id="fields"></div>
          <div class="actions">
            <button class="btn primary" id="send-btn" type="submit">Enviar</button>
            <button class="btn" type="reset">Limpiar</button>
          </div>
        </form>

        <form id="manual-form" hidden>
          <div class="manual-line">
            <select id="manual-method" aria-label="Método">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>DELETE</option>
            </select>
            <input id="manual-path" value="/api/users" aria-label="Ruta" spellcheck="false">
          </div>
          <div class="field">
            <label for="manual-body"><code>body</code><span>JSON, opcional</span></label>
            <textarea id="manual-body" rows="8" spellcheck="false" placeholder='{ "nombre": "Ana" }'></textarea>
          </div>
          <div class="actions">
            <button class="btn primary" type="submit">Enviar</button>
          </div>
        </form>
      </section>

      <section class="panel response" aria-label="Respuesta">
        <div class="response-head">
          <span id="res-status" class="status">Sin enviar</span>
          <span id="res-meta"></span>
          <button id="copy-response" class="link-btn" type="button" hidden>Copiar</button>
        </div>
        <pre id="response-json" class="placeholder">La respuesta del servidor aparece aquí.</pre>
      </section>

      <section class="panel data" aria-label="Datos guardados">
        <div class="data-head">
          <h2 id="data-title">Usuarios</h2>
          <code id="data-file">src/data/users.json</code>
          <span id="data-count"></span>
          <button class="btn small" id="load-records" type="button">Recargar</button>
        </div>
        <div class="table-wrap">
          <table id="records"></table>
        </div>
      </section>
    </main>
  </div>

  <datalist id="id-options"></datalist>
  <datalist id="owner-options"></datalist>
  <div id="toast" role="status"></div>
  <script src="/tester.js" defer></script>
</body>

</html>
